name: Voice Samples

# OpenAI TTS と VOICEVOX の男性ボイス候補でサンプルmp3を一括生成し、
# previews/voice-samples/ にコミットする。GitHub上でmp3をクリックすると
# そのまま再生できるので、聴き比べて Repository Variables に設定する:
#   OpenAI採用:   OPENAI_TTS_MODEL / OPENAI_TTS_VOICE
#   VOICEVOX採用: TTS_PROVIDER=voicevox / VOICEVOX_SPEAKER=<スタイルID>
on:
  workflow_dispatch:
    inputs:
      sample_text:
        description: "読み上げるサンプル文（空欄ならデフォルト文）"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  samples:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      voicevox:
        image: voicevox/voicevox_engine:cpu-ubuntu20.04-latest
        ports:
          - 50021:50021
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - name: Wait for VOICEVOX engine
        run: |
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:50021/version && exit 0
            sleep 3
          done
          echo "VOICEVOXエンジンが起動しませんでした（VOICEVOXサンプルはスキップされます）"
      - name: Generate voice samples
        run: npm run voice-samples
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          VOICE_SAMPLE_TEXT: ${{ github.event.inputs.sample_text }}
      - name: Commit samples
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add previews/voice-samples
          git commit -m "voice samples: 候補ボイスのサンプル音声" || echo "no changes"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push
