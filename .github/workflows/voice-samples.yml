name: Voice Samples

# 候補ボイスのサンプルmp3を一括生成し、previews/voice-samples/ にコミットする。
# GitHub上でmp3をクリックするとそのまま再生できるので、聴き比べて
# Settings → Secrets and variables → Actions → Variables に
# OPENAI_TTS_MODEL / OPENAI_TTS_VOICE を設定する。
on:
  workflow_dispatch:
    inputs:
      sample_text:
        description: "読み上げるサンプル文（空欄ならデフォルト文）"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  samples:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Generate voice samples
        run: npm run voice-samples
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VOICE_SAMPLE_TEXT: ${{ github.event.inputs.sample_text }}
      - name: Commit samples
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add previews/voice-samples
          git commit -m "voice samples: 候補ボイスのサンプル音声" || echo "no changes"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push
