name: Auto Generate Video

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "動画テーマ（空欄ならAIが自動選定）"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 明朝体フォント（レンダリング用）と ffmpeg（音声の無音挿入・結合用）を導入
      - name: Install fonts & ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-noto-cjk-extra ffmpeg

      - name: Install dependencies
        run: npm ci

      # Secretsに登録されたキーの「形式」と「認証可否」だけを確認する診断ステップ。
      # キー本体はログに出さない（長さ・先頭12文字・APIの応答コードのみ）。
      - name: Verify API keys
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          AK=$(printf '%s' "$ANTHROPIC_API_KEY" | tr -d '[:space:]')
          echo "== ANTHROPIC_API_KEY =="
          echo "length : ${#AK}"
          echo "prefix : ${AK:0:12}..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://api.anthropic.com/v1/models \
            -H "x-api-key: $AK" -H "anthropic-version: 2023-06-01")
          echo "auth check (GET /v1/models): HTTP $STATUS  (200=OK, 401=キーが無効)"

          OK=$(printf '%s' "$OPENAI_API_KEY" | tr -d '[:space:]')
          echo "== OPENAI_API_KEY =="
          echo "length : ${#OK}"
          echo "prefix : ${OK:0:8}..."
          OSTATUS=$(curl -s -o /dev/null -w "%{http_code}" https://api.openai.com/v1/models \
            -H "Authorization: Bearer $OK")
          echo "auth check (GET /v1/models): HTTP $OSTATUS  (200=OK, 401=キーが無効)"

          if [ "$STATUS" != "200" ]; then
            echo "::error::ANTHROPIC_API_KEY が無効です (HTTP $STATUS)。console.anthropic.com の API Keys で発行した sk-ant-api03-... のキーを Secrets に登録し直してください。"
            exit 1
          fi

      - name: Generate script & audio
        run: npm run generate -- --topic="${{ github.event.inputs.topic }}"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Render video with Remotion
        run: npx remotion render src/remotion/index.ts Main out/video.mp4

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-video
          path: |
            out/video.mp4
            src/data/script.json
            src/data/sync-map.json
          retention-days: 14

      # レビュー用: 8秒おきのフレームと低解像度プレビューをリポジトリにコミットする。
      # これによりClaude（開発エージェント）が実際の生成結果を確認して改善できる。
      - name: Extract & commit previews
        if: always() && hashFiles('out/video.mp4') != ''
        run: |
          sudo apt-get install -y ffmpeg
          rm -rf previews/latest
          mkdir -p previews/latest
          ffmpeg -y -i out/video.mp4 -vf "fps=1/8,scale=960:-1" -q:v 4 previews/latest/frame-%03d.jpg
          ffmpeg -y -i out/video.mp4 -vf scale=640:-2 -c:v libx264 -crf 34 -preset veryfast -c:a aac -b:a 64k previews/latest/preview.mp4
          cp src/data/script.json src/data/sync-map.json src/data/images.json src/data/assets.json previews/latest/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add previews
          git commit -m "previews: run #${{ github.run_number }} の生成結果" || echo "no changes to commit"
          git pull --rebase origin ${{ github.ref_name }} || true
          git push

# NOTE: workflow_dispatch はActionsタブの「Run workflow」から手動実行する
