name: Auto Generate Video

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "動画テーマ（空欄ならAIが自動選定。台本Gist指定時は無視）"
        required: false
        default: ""
      script_gist:
        description: "台本JSONのGist URL/IDまたは生JSON URL（指定時はAI台本生成をスキップ）"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    # 20分尺: 台本生成 ~25分 + TTS ~15分 + レンダリング ~40分 + 余裕
    timeout-minutes: 170
    services:
      # TTS_PROVIDER=voicevox のときに使う無料TTSエンジン（未使用時も起動するが無害）
      voicevox:
        image: voicevox/voicevox_engine:cpu-ubuntu20.04-latest
        ports:
          - 50021:50021
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 明朝体フォント（レンダリング用）と ffmpeg（音声の無音挿入・結合用）を導入
      - name: Install fonts & ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-noto-cjk-extra ffmpeg

      - name: Install dependencies
        run: npm ci

      # Secretsに登録されたキーの「形式」と「認証可否」だけを確認する診断ステップ。
      # キー本体はログに出さない（長さ・先頭12文字・APIの応答コードのみ）。
      - name: Verify API keys
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
          TTS_PROVIDER: ${{ vars.TTS_PROVIDER }}
          SCRIPT_GIST: ${{ github.event.inputs.script_gist }}
        run: |
          # 台本生成でもGist台本へのAI演出付けでもAnthropicキーを使うので常に検証する。
          # （Gistがvisual付きの完全台本ならAIは呼ばれないが、キー確認は無料なので実施）
          if [ -n "$SCRIPT_GIST" ]; then
            echo "== 台本ソース: Gist/URL 指定あり（visual未指定なら内容をAIが演出付け） =="
          fi
          AK=$(printf '%s' "$ANTHROPIC_API_KEY" | tr -d '[:space:]')
          echo "== ANTHROPIC_API_KEY =="
          echo "length : ${#AK}"
          echo "prefix : ${AK:0:12}..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://api.anthropic.com/v1/models \
            -H "x-api-key: $AK" -H "anthropic-version: 2023-06-01")
          echo "auth check (GET /v1/models): HTTP $STATUS  (200=OK, 401=キーが無効)"
          if [ "$STATUS" != "200" ]; then
            echo "::error::ANTHROPIC_API_KEY が無効です (HTTP $STATUS)。console.anthropic.com の API Keys で発行した sk-ant-api03-... のキーを Secrets に登録し直してください。"
            exit 1
          fi

          # TTS_PROVIDER 未指定時: ELEVENLABS_API_KEY があれば elevenlabs（v3×DAISUKE）、なければ voicevox。
          EK=$(printf '%s' "$ELEVENLABS_API_KEY" | tr -d '[:space:]')
          PROVIDER="${TTS_PROVIDER:-}"
          if [ -z "$PROVIDER" ]; then
            if [ -n "$EK" ]; then PROVIDER="elevenlabs"; else PROVIDER="voicevox"; fi
          fi
          echo "== TTS provider: $PROVIDER =="
          if [ "$PROVIDER" = "elevenlabs" ]; then
            if [ -z "$EK" ]; then
              echo "::error::TTS_PROVIDER=elevenlabs ですが ELEVENLABS_API_KEY が未設定です。"
              exit 1
            fi
            ESTATUS=$(curl -s -o /dev/null -w "%{http_code}" https://api.elevenlabs.io/v1/user -H "xi-api-key: $EK")
            echo "auth check (GET /v1/user): HTTP $ESTATUS"
            if [ "$ESTATUS" != "200" ]; then
              echo "::error::ELEVENLABS_API_KEY が無効です (HTTP $ESTATUS)。"
              exit 1
            fi
            VOICE_ID="${ELEVENLABS_VOICE_ID:-xQpTJhLkPZnRFTV4mc3k}"
            VSTATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://api.elevenlabs.io/v1/voices/$VOICE_ID" -H "xi-api-key: $EK")
            echo "voice check (GET /v1/voices/$VOICE_ID): HTTP $VSTATUS"
            if [ "$VSTATUS" != "200" ]; then
              echo "::error::ボイス $VOICE_ID がこのアカウントから使えません (HTTP $VSTATUS)。Voice Libraryで「Add to My Voices」を押してください。"
              exit 1
            fi
          fi

      # VOICEVOXエンジン（デフォルトのTTS）が起動するまで待つ
      - name: Wait for VOICEVOX engine
        run: |
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:50021/version && echo " VOICEVOX ready" && exit 0
            sleep 3
          done
          echo "::warning::VOICEVOXエンジンが起動しませんでした（推定尺にフォールバックします）"

      - name: Generate script & audio
        run: |
          if [ -n "${{ github.event.inputs.script_gist }}" ]; then
            npm run generate -- --gist="${{ github.event.inputs.script_gist }}"
          else
            npm run generate -- --topic="${{ github.event.inputs.topic }}"
          fi
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          # シークレットGistを使う場合のみ: gistスコープのPATを Secrets に GIST_TOKEN として登録
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          # 以下は Settings → Secrets and variables → Actions → Variables で上書き可能
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          TTS_PROVIDER: ${{ vars.TTS_PROVIDER }}
          OPENAI_TTS_MODEL: ${{ vars.OPENAI_TTS_MODEL }}
          OPENAI_TTS_VOICE: ${{ vars.OPENAI_TTS_VOICE }}
          OPENAI_TTS_SPEED: ${{ vars.OPENAI_TTS_SPEED }}
          VOICEVOX_SPEAKER: ${{ vars.VOICEVOX_SPEAKER }}
          VOICEVOX_VOLUME: ${{ vars.VOICEVOX_VOLUME }}
          ELEVENLABS_MODEL: ${{ vars.ELEVENLABS_MODEL }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
          BGM_PROVIDER: ${{ vars.BGM_PROVIDER }}
          BGM_LENGTH_MS: ${{ vars.BGM_LENGTH_MS }}

      - name: Render video with Remotion
        run: npx remotion render src/remotion/index.ts Main out/video.mp4

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-video
          path: |
            out/video.mp4
            src/data/script.json
            src/data/sync-map.json
            public/assets/bgm-credit.txt
          retention-days: 14

      # レビュー用: 8秒おきのフレームと低解像度プレビューをリポジトリにコミットする。
      # これによりClaude（開発エージェント）が実際の生成結果を確認して改善できる。
      - name: Extract & commit previews
        if: always() && hashFiles('out/video.mp4') != ''
        run: |
          sudo apt-get install -y ffmpeg
          rm -rf previews/latest
          mkdir -p previews/latest
          # 20分尺: フレームは15秒おき(約80枚)、preview.mp4はGitHubの100MB制限を避けて冒頭4分のみ
          ffmpeg -y -i out/video.mp4 -vf "fps=1/15,scale=960:-1" -q:v 4 previews/latest/frame-%03d.jpg
          ffmpeg -y -i out/video.mp4 -t 240 -vf scale=640:-2 -c:v libx264 -crf 36 -preset veryfast -c:a aac -b:a 64k previews/latest/preview.mp4
          cp src/data/script.json src/data/sync-map.json src/data/assets.json previews/latest/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add previews
          git commit -m "previews: run #${{ github.run_number }} の生成結果" || echo "no changes to commit"
          # 生成で変わった作業ツリー(src/data等)を捨ててからrebaseする（unstaged changesでの失敗防止）
          git checkout -- . || true
          git pull --rebase origin ${{ github.ref_name }} || true
          git push

# NOTE: workflow_dispatch はActionsタブの「Run workflow」から手動実行する
